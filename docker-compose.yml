name: fashion-shop

services:
  # =====================================================================
  # 1. PostgreSQL 14.24 - Official Alpine 3.23 Image
  # (Source of Truth: Users, Catalog, Inventory, Orders, Payments, Outbox)
  # =====================================================================
  postgres:
    image: postgres:14.24-alpine3.23
    container_name: fashion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fashion} -d $${POSTGRES_DB:-fashion_shop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fashion-net

  # =====================================================================
  # 2. MongoDB 9.0.4 - Official MongoDB Community Server (UBI9 Slim)
  # (Reviews, Chat Conversations/Messages, Notifications, Activity Logs Time-Series)
  # =====================================================================
  mongodb:
    image: mongodb/mongodb-community-server:9.0.4-ubi9-slim
    container_name: fashion-mongodb
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USER:-fashion}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fashion_secret}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fashion}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fashion_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fashion_shop}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fashion-net

  # =====================================================================
  # 3. Redis - Official Alpine 3.23 Image
  # (JWT RT/Blacklist, Cart, Stock Gate Lua, Redisson Lock, Cache, WS Presence)
  # =====================================================================
  redis:
    image: redis:alpine3.23
    container_name: fashion-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fashion-net

  # =====================================================================
  # 4. Elasticsearch 9.5.5 - Official Elastic Image
  # (Read Model: Product Search, Vietnamese Analyzer, Facets, Autocomplete)
  # =====================================================================
  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: fashion-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
      - TZ=Asia/Ho_Chi_Minh
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - fashion-net

  # =====================================================================
  # 5. MinIO 2025.7.23 - Bitnami Legacy
  # (S3-Compatible Object Storage: tự động khởi tạo fashion-public & fashion-private)
  # =====================================================================
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: fashion-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DEFAULT_BUCKETS: "fashion-public:download,fashion-private:none"
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fashion-net

  # =====================================================================
  # 6. RabbitMQ 4.3.7 - Official Management Image + STOMP Plugin
  # (STOMP Broker Relay khi scale ngang nhiều instance WebSocket)
  # =====================================================================
  rabbitmq:
    image: rabbitmq:4.3.7-management
    container_name: fashion-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fashion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fashion_secret}
      TZ: Asia/Ho_Chi_Minh
    entrypoint: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_web_stomp && exec docker-entrypoint.sh rabbitmq-server"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
      - "${RABBITMQ_STOMP_PORT:-61613}:61613"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - fashion-net

networks:
  fashion-net:
    driver: bridge
