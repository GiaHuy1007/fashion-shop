name: fashion-shop

services:
  # =====================================================================
  # 1. PostgreSQL 18 (Source of truth: Users, Catalog, Inventory, Orders, Payments, Outbox)
  # =====================================================================
  postgres:
    image: postgres:18.6-alpine
    container_name: fashion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashion_shop}
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_secret}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fashion} -d $${POSTGRES_DB:-fashion_shop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fashion-net

  # =====================================================================
  # 2. MongoDB 9 (Reviews, Chat Conversations/Messages, Notifications, Activity Logs Time-Series)
  # =====================================================================
  mongodb:
    image: mongo:9.0.4
    container_name: fashion-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fashion}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fashion_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fashion_shop}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fashion-net

  # =====================================================================
  # 3. Redis 8.8 (JWT RT/Blacklist, Cart, Stock Gate Lua, Redisson Lock, Cache, WS Presence)
  # =====================================================================
  redis:
    image: redis:8.8.3-alpine
    container_name: fashion-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fashion-net

  # =====================================================================
  # 4. Elasticsearch 9.5 (Read Model: Product Search, Vietnamese Analyzer, Facets, Autocomplete)
  # =====================================================================
  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: fashion-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - TZ=Asia/Ho_Chi_Minh
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - fashion-net

  # =====================================================================
  # 5. MinIO (S3-Compatible Object Storage: fashion-public & fashion-private)
  # =====================================================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: fashion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fashion-net

  # Tự động khởi tạo bucket fashion-public (public-read) & fashion-private (private + lifecycle xoá tmp/ sau 1 ngày)
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: fashion-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/fashion-public;
      mc mb --ignore-existing local/fashion-private;
      mc anonymous set download local/fashion-public;
      mc ilm rule add --prefix 'tmp/' --expire-days 1 local/fashion-private || true;
      exit 0;
      "
    networks:
      - fashion-net

  # =====================================================================
  # 6. RabbitMQ 4.4 + STOMP Plugin (STOMP Broker Relay khi scale ngang nhiều instance)
  # =====================================================================
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    container_name: fashion-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fashion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fashion_secret}
      TZ: Asia/Ho_Chi_Minh
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_web_stomp && rabbitmq-server"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
      - "${RABBITMQ_STOMP_PORT:-61613}:61613"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - fashion-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  es_data:
  minio_data:
  rabbitmq_data:

networks:
  fashion-net:
    driver: bridge
