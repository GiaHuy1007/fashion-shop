spring:
  application:
    name: fashion-shop
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 25MB

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  data:
    mongodb:
      auto-index-creation: false
    redis:
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 1s

  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 10m

  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/xml,text/plain
    min-response-size: 1024

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      elasticsearchSearch:
        base-config: default
        slow-call-duration-threshold: 1500ms
      paymentGateway:
        base-config: default
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s

  retry:
    instances:
      elasticsearchSearch:
        max-attempts: 2
        wait-duration: 150ms
      paymentGateway:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  timelimiter:
    instances:
      elasticsearchSearch:
        timeout-duration: 2s
      paymentGateway:
        timeout-duration: 8s

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  base-path: /api/v1
  default-currency: VND

  jwt:
    issuer: fashion-shop-api
    access-ttl: 15m
    refresh-ttl: 14d
    clock-skew-seconds: 30
    cookie-name: refresh_token
    cookie-path: /api/v1/auth
    cookie-same-site: Strict

  auth:
    brute-force:
      max-attempts: 5
      lock-duration: 15m

  minio:
    public-bucket: ${MINIO_PUBLIC_BUCKET:fashion-public}
    private-bucket: ${MINIO_PRIVATE_BUCKET:fashion-private}
    presign-post-ttl: 10m
    presign-get-ttl: 1h
    max-image-size-bytes: 10485760   # 10MB

  inventory:
    reservation-online-ttl: 15m
    reservation-cod-ttl: 48h
    reconcile-cron: "0 */5 * * * *"
    expire-check-interval-ms: 30000
    expire-batch-size: 100

  search:
    read-alias: products
    write-alias: products_write
    synonyms-set: fashion-vi-synonyms
    outbox-poll-interval-ms: 1000
    outbox-batch-size: 100
    outbox-max-attempts: 5
    cache-query-ttl: 60s
    cache-suggest-ttl: 5m

  websocket:
    heartbeat-in-ms: 10000
    heartbeat-out-ms: 10000
    ticket-ttl: 30s
    presence-ttl: 60s
    chat-rate-limit-messages: 20
    chat-rate-limit-window: 10s
